<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rain 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: white;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.box-container {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 5;
    transition: opacity 0.5s;
}

.gift {
    width: 110px;
    height: 100px;
    background: #ffb6c9;
    border: 3px solid #ff5c91;
    border-radius: 12px;
    font-size: 45px;
    cursor: pointer;
    box-shadow: 0 5px 20px #ffd4e1;
    animation: bounce 1.5s infinite;
}

.hint {
    margin-top: 20px;
    color: #ff4f87;
    font-size: 16px;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* Falling I LOVE YOU drops */

.drop {
    position: absolute;
    top: -80px;
    left: 0;
    white-space: nowrap;
    color: #ff4f87;
    font-weight: bold;
    pointer-events: none;
    user-select: none;
    animation: rainfall linear forwards;
    will-change: transform;
}

@keyframes rainfall {
    0% {
        transform: translateY(-80px) rotate(-8deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        transform: translateY(115vh) rotate(8deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="box-container" id="intro">
    <button class="gift" onclick="startRain()" aria-label="Open gift">
        🎁
    </button>
    <p class="hint">Tap the box 💗</p>
</div>

<script>
let rainTimer = null;

function startRain() {
    document.getElementById("intro").style.display = "none";

    // Start a continuous shower
    rainTimer = setInterval(createDrop, 100);
}

function createDrop() {
    const drop = document.createElement("div");
    drop.className = "drop";

    drop.textContent = "I LOVE YOU 💗";

    // Different sizes, like water drops
    const size = 10 + Math.random() * 25;
    drop.style.fontSize = size + "px";

    // Random positions across the screen
    drop.style.left = Math.random() * 90 + "%";

    // Different falling speeds
    const duration = 2 + Math.random() * 4;
    drop.style.animationDuration = duration + "s";

    // Slightly different pink shades
    const colors = [
        "#ff1744",
        "#ff4f87",
        "#ff69a6",
        "#e91e63",
        "#ff85a1",
        "#d81b60"
    ];

    drop.style.color =
        colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(drop);

    // Remove after the animation
    setTimeout(() => {
        drop.remove();
    }, (duration + 1) * 1000);
}
</script>

</body>
</html>
